<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title desc">
  <title id="title">ExposureIQ avatar</title>
  <desc id="desc">Mint scan-aperture symbol on a dark background with teal and violet glows.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141D29"/>
      <stop offset="1" stop-color="#0B151C"/>
    </linearGradient>

    <radialGradient id="mintGlow">
      <stop offset="0" stop-color="#20C9B3" stop-opacity=".31"/>
      <stop offset="1" stop-color="#20C9B3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#9297FF" stop-opacity=".27"/>
      <stop offset="1" stop-color="#9297FF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#A5B9B6" opacity=".19"/>
    </pattern>

    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#background)"/>
  <ellipse cx="345" cy="650" rx="610" ry="600" fill="url(#mintGlow)"/>
  <ellipse cx="845" cy="165" rx="550" ry="520" fill="url(#violetGlow)"/>
  <rect width="1024" height="1024" fill="url(#dots)"/>

  <!-- Soft glow behind the symbol -->
  <g transform="translate(297 297)"
     fill="none"
     stroke="#38E1C3"
     stroke-width="32"
     stroke-linecap="square"
     opacity=".18"
     filter="url(#markGlow)">
    <path d="M0 113V0h113
             M317 0h113v113
             M430 317v113H317
             M113 430H0V317"/>
    <path d="M104 215h222" stroke-width="19"/>
    <circle cx="215" cy="215" r="37" fill="#38E1C3" stroke="none"/>
  </g>

  <!-- Scan-aperture mark from the new banner -->
  <g transform="translate(297 297)"
     fill="none"
     stroke="#38E1C3"
     stroke-width="32"
     stroke-linecap="square"
     stroke-linejoin="miter">
    <path d="M0 113V0h113
             M317 0h113v113
             M430 317v113H317
             M113 430H0V317"/>
    <path d="M104 215h222" stroke-width="19"/>
    <circle cx="215" cy="215" r="37" fill="#38E1C3" stroke="none"/>
  </g>
</svg>