<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-label="ExposureIQ brand hero featuring stylized previews of its terminal interface">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D141B"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#20D4B7" stop-opacity=".15"/>
      <stop offset="1" stop-color="#20D4B7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#78918E" stroke-opacity=".1"/>
      <circle cx="0" cy="0" r="1" fill="#78918E" opacity=".2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <clipPath id="terminalClip">
      <rect x="678" y="85" width="862" height="541" rx="12"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="720" fill="url(#background)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <ellipse cx="390" cy="320" rx="600" ry="500" fill="url(#ambient)"/>
  <path d="M0 677H1600" stroke="#28403D"/>
  <text x="72" y="701" fill="#78918E" font-family="monospace" font-size="11" letter-spacing="2">EXTERNAL EXPOSURE INTELLIGENCE</text>
  <text x="1438" y="701" fill="#78918E" font-family="monospace" font-size="11" letter-spacing="2">EXIQ / 001</text>

  <!-- Brand symbol -->
  <g transform="translate(73 104)" fill="none" stroke="#38E1C3" stroke-linecap="square">
    <path d="M0 25V0h25M70 0h25v25M95 70v25H70M25 95H0V70" stroke-width="5"/>
    <path d="M22 47.5h51" stroke-width="3"/>
    <circle cx="47.5" cy="47.5" r="8" fill="#38E1C3" stroke="none"/>
  </g>

  <!-- Brand copy -->
  <text x="72" y="291" fill="#F1F6F3" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="72" letter-spacing="-4">Exposure<tspan fill="#38E1C3">IQ</tspan></text>
  <rect x="74" y="317" width="44" height="3" fill="#38E1C3"/>
  <text x="73" y="365" fill="#BED0CA" font-family="Arial, Helvetica, sans-serif" font-size="27">See what's exposed.</text>
  <text x="73" y="402" fill="#7E9B94" font-family="monospace" font-size="14" letter-spacing="1">KNOW WHAT CHANGED.</text>

  <!-- Small preview of the real home screen -->
  <g filter="url(#shadow)">
    <rect x="72" y="454" width="537" height="172" rx="10" fill="#0B1424" stroke="#30514D"/>
    <path d="M72 490H609" stroke="#38E1C3" stroke-opacity=".7"/>
    <text x="91" y="478" fill="#38E1C3" font-family="monospace" font-size="12" font-weight="bold">ExposureIQ</text>
    <text x="184" y="478" fill="#A7B5BC" font-family="monospace" font-size="12">· v0.1.0</text>
    <text x="277" y="478" fill="#9297FF" font-family="monospace" font-size="12">· home</text>

    <text x="94" y="525" fill="#E6F0ED" font-family="monospace" font-size="15" font-weight="bold">Scan a domain</text>
    <rect x="94" y="541" width="348" height="38" rx="3" fill="#111E2B" stroke="#38E1C3"/>
    <text x="108" y="565" fill="#9BAEB0" font-family="monospace" font-size="13">example.com</text>
    <rect x="450" y="541" width="135" height="38" rx="3" fill="#20C9B3"/>
    <text x="500" y="565" fill="#09201E" font-family="monospace" font-size="13" font-weight="bold">Scan</text>
    <text x="95" y="603" fill="#A7B5BC" font-family="monospace" font-size="11">View saved results  ·  Add domain to my scope</text>
  </g>

  <!-- Main TUI preview -->
  <g filter="url(#shadow)">
    <rect x="678" y="85" width="862" height="541" rx="12" fill="#0B1424" stroke="#365752"/>
  </g>
  <g clip-path="url(#terminalClip)" font-family="monospace">
    <!-- Header -->
    <rect x="678" y="85" width="862" height="48" fill="#0B1424"/>
    <text x="700" y="115" fill="#38E1C3" font-size="13">←  ExposureIQ</text>
    <text x="838" y="115" fill="#E5EEEB" font-size="13">|  example.com</text>
    <text x="1009" y="115" fill="#9BAEB0" font-size="12">·  2026-11-02 19:41 UTC</text>
    <path d="M678 133H1540" stroke="#38E1C3"/>

    <!-- Saved result / tabs -->
    <text x="700" y="164" fill="#9297FF" font-size="12">Saved scan · read-only preview — no probes sent</text>
    <text x="700" y="191" fill="#F0F5F2" font-size="12">Summary</text>
    <text x="779" y="191" fill="#84949B" font-size="12">Subdomains</text>
    <text x="887" y="191" fill="#84949B" font-size="12">Hosts</text>
    <text x="947" y="191" fill="#84949B" font-size="12">Technologies</text>
    <text x="1078" y="191" fill="#84949B" font-size="12">Findings</text>
    <text x="1169" y="191" fill="#84949B" font-size="12">Ports</text>
    <text x="1232" y="191" fill="#84949B" font-size="12">Diff</text>
    <path d="M699 202H1518" stroke="#314247"/>
    <path d="M699 202H762" stroke="#38E1C3" stroke-width="3"/>

    <!-- Actual finding counts shown in screenshot -->
    <text x="700" y="232" fill="#E6EFEC" font-size="13" font-weight="bold">Findings</text>
    <text x="799" y="232" fill="#FF6268" font-size="13" font-weight="bold">HIGH 3</text>
    <text x="886" y="232" fill="#FFBB54" font-size="13" font-weight="bold">MEDIUM 1</text>
    <text x="998" y="232" fill="#83BBFF" font-size="13" font-weight="bold">LOW 1</text>

    <!-- Phase table -->
    <rect x="699" y="249" width="385" height="320" rx="4" fill="#111E2B"/>
    <rect x="699" y="249" width="385" height="25" fill="#1C303A"/>
    <text x="714" y="266" fill="#38E1C3" font-size="12">Phase</text>
    <text x="832" y="266" fill="#38E1C3" font-size="12">State</text>
    <text x="920" y="266" fill="#38E1C3" font-size="12">Count</text>
    <text x="1003" y="266" fill="#38E1C3" font-size="12">Seconds</text>
    <rect x="699" y="274" width="385" height="23" fill="#203857"/>
    <g fill="#E4EEEB" font-size="12">
      <text x="714" y="290">Scope</text><text x="832" y="290">saved</text><text x="932" y="290">5</text><text x="1003" y="290">0.0</text>
      <text x="714" y="316">Subdomains</text><text x="832" y="316">saved</text><text x="932" y="316">4</text><text x="1003" y="316">0.0</text>
      <text x="714" y="342">IP lookup</text><text x="832" y="342">saved</text><text x="932" y="342">5</text><text x="1003" y="342">0.0</text>
      <text x="714" y="368">Web checks</text><text x="832" y="368">saved</text><text x="932" y="368">3</text><text x="1003" y="368">0.0</text>
      <text x="714" y="394">Ports</text><text x="832" y="394">saved</text><text x="932" y="394">2</text><text x="1003" y="394">0.0</text>
      <text x="714" y="420">Save</text><text x="832" y="420">saved</text><text x="932" y="420">5</text><text x="1003" y="420">0.0</text>
    </g>

    <!-- Demo details panel, based on screenshot -->
    <rect x="1103" y="249" width="415" height="320" rx="4" fill="#0B1424" stroke="#9297FF" stroke-width="1.5"/>
    <text x="1122" y="280" fill="#FFBB54" font-size="11" font-weight="bold">DEMO — saved fake data</text>
    <text x="1122" y="298" fill="#FFBB54" font-size="11">read-only preview (no probes sent)</text>
    <g fill="#E4EEEB" font-size="12">
      <text x="1122" y="335">Target       example.com</text>
      <text x="1122" y="358">Subdomains   4</text>
      <text x="1122" y="381">Hosts        5</text>
      <text x="1122" y="404">Unique IPs   2</text>
      <text x="1122" y="427">Scan time    2026-11-02 19:41 UTC</text>
      <text x="1122" y="464">Saved file</text>
      <text x="1122" y="485">results/demo_20261102-214117.json</text>
    </g>

    <!-- TUI keyboard hints -->
    <rect x="678" y="594" width="862" height="32" fill="#182639"/>
    <text x="700" y="615" fill="#A7B5BC" font-size="11">← saved results    Tab panels    ↑↓←→ move    Enter detail    q quit</text>
  </g>

  <!-- A small visual connection between the brand and its interface -->
  <path d="M626 352h24m0 0-6-6m6 6-6 6" fill="none" stroke="#38E1C3" stroke-opacity=".65" stroke-width="1.5"/>
</svg>